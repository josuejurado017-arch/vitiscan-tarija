[platformio]
default_envs = node_sensor, gateway_node
src_dir = .

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/patch_dependencies.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -DVITISCAN_BENCH_EXTERNAL_SYNC=0
    -DVITISCAN_RF_TIMING_VALIDATED=0
    -DVITISCAN_SYNTHETIC_SENSORS=1
    -DVITISCAN_ENABLE_DEEP_SLEEP=0
lib_deps =
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.11.0
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.15

[env:node_sensor]
build_src_filter = -<*> +<common/*.cpp> +<node_sensor/main.cpp>
build_flags = ${env.build_flags} -DVITISCAN_NODE_ID=16

[env:gateway_node]
build_src_filter = -<*> +<common/bench_runtime.cpp> +<gateway_node/main.cpp>
build_flags = ${env.build_flags} -DVITISCAN_NODE_ID=0
